<!DOCTYPE html>
<!-- 문서가 HTML5 표준임을 선언합니다. -->
<html lang="ko">
  <!-- 문서의 언어가 한국어임을 지정합니다. -->

  <head>
    <!-- 문서의 메타데이터를 담습니다. -->
    <meta charset="UTF-8">
    <!-- 한글이 정상적으로 표시되도록 문자 인코딩을 지정합니다. -->
    <title>계좌 카드</title>
    <!-- 브라우저 탭에 표시할 문서 제목을 지정합니다. -->
  </head>

  <body>
    <!-- 화면에 표시되는 본문 영역입니다. -->

    <main>
      <!-- 페이지의 핵심 콘텐츠를 나타냅니다. -->

      <article aria-labelledby="bank-name">
        <!-- 하나의 독립적인 계좌 카드 콘텐츠를 나타냅니다. -->

        <header>
          <!-- 계좌 카드의 제목 영역을 나타냅니다. -->
          <h1 id="bank-name">○○은행</h1>
          <!-- 카드의 주요 제목인 은행명을 표시합니다. -->
        </header>

        <dl>
          <!-- 계좌 정보와 값을 의미적으로 연결합니다. -->
          <dt>계좌번호</dt>
          <!-- 계좌번호 항목의 이름을 표시합니다. -->
          <dd>110-***-******</dd>
          <!-- 마스킹된 계좌번호 값을 표시합니다. -->

          <dt>잔액</dt>
          <!-- 잔액 항목의 이름을 표시합니다. -->
          <dd>₩1,250,000</dd>
          <!-- 계좌의 현재 잔액을 표시합니다. -->
        </dl>

        <nav aria-label="계좌 메뉴">
          <!-- 계좌와 관련된 이동 및 동작 메뉴를 그룹화합니다. -->
          <section aria-label="계좌 메뉴">
            <!-- 계좌와 관련된 버튼을 하나의 영역으로 묶습니다. -->
            <button type="button">이체</button>
            <!-- 이체 기능을 실행합니다. -->

            <button type="button">상세</button>
            <!-- 계좌 상세 정보를 확인합니다. -->
          </section>
        </nav>
      </article>
    </main>
  </body>
</html>
