<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>나를 설명하는 3가지 키워드</title>
</head>
<body>
	<header>
		<h1>나를 설명하는 3가지 키워드</h1>
		<p>내가 좋아하고 즐겨 하는 것들을 소개합니다.</p>

		<nav aria-label="주요 메뉴">
			<ul>
				<li><a href="index.html">프로필</a></li>
				<li><a href="keyword.html" aria-current="page">나의 키워드</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section aria-labelledby="keyword-heading">
			<h2 id="keyword-heading">나의 키워드</h2>

			<article>
				<fieldset>
					<legend><span aria-hidden="true">01</span> 즐겨보는 콘텐츠</legend>
					<figure>
						<img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" alt="게임을 즐기는 사람의 손과 게임 컨트롤러">
						<figcaption>PLAY / WATCH</figcaption>
					</figure>
					<dl>
						<dt>내가 즐겨보는 콘텐츠는?</dt>
						<dd><strong>게임 유튜브</strong></dd>
					</dl>
				</fieldset>
			</article>

			<article>
				<fieldset>
					<legend><span aria-hidden="true">02</span> 취미</legend>
					<figure>
						<img src="https://images.unsplash.com/photo-1593305841991-05c297ba4575?auto=format&fit=crop&w=800&q=80" alt="조명이 켜진 게임 모니터와 책상">
						<figcaption>FOCUS / PLAY</figcaption>
					</figure>
					<dl>
						<dt>나의 취미는?</dt>
						<dd><strong>게임하기</strong></dd>
					</dl>
				</fieldset>
			</article>

			<article>
				<fieldset>
					<legend><span aria-hidden="true">03</span> 외출 필수품</legend>
					<figure>
						<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80" alt="손에 들고 있는 스마트폰">
						<figcaption>ALWAYS / WITH ME</figcaption>
					</figure>
					<dl>
						<dt>외출할 때 가방에 꼭 챙기는 물품은?</dt>
						<dd><strong>휴대폰</strong></dd>
					</dl>
				</fieldset>
			</article>
		</section>
	</main>

	<footer>
		<p>나를 알아가는 작은 기록</p>
	</footer>
</body>
</html>
