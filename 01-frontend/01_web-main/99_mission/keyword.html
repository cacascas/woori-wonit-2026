<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>나를 설명하는 3가지 키워드</title>
</head>
<body>
	<header>
		<h1>나를 설명하는 3가지 키워드</h1>
		<p>내가 좋아하고 즐겨 하는 것들을 소개합니다.</p>

		<nav aria-label="주요 메뉴">
			<ul>
				<li><a href="index.html">프로필</a></li>
				<li><a href="keyword.html" aria-current="page">나의 키워드</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section aria-labelledby="keyword-heading">
			<h2 id="keyword-heading">나의 키워드</h2>

			<article>
				<fieldset>
					<legend>키워드 1 · 즐겨보는 콘텐츠</legend>
					<dl>
						<dt>내가 즐겨보는 콘텐츠는?</dt>
						<dd><strong>게임 유튜브</strong></dd>
					</dl>
				</fieldset>
			</article>

			<article>
				<fieldset>
					<legend>키워드 2 · 취미</legend>
					<dl>
						<dt>나의 취미는?</dt>
						<dd><strong>게임하기</strong></dd>
					</dl>
				</fieldset>
			</article>

			<article>
				<fieldset>
					<legend>키워드 3 · 외출 필수품</legend>
					<dl>
						<dt>외출할 때 가방에 꼭 챙기는 물품은?</dt>
						<dd><strong>휴대폰</strong></dd>
					</dl>
				</fieldset>
			</article>
		</section>
	</main>

	<footer>
		<p>나를 알아가는 작은 기록</p>
	</footer>
</body>
</html>
